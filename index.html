<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnel by stages — chart comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="page">
    <section class="widget">
      <div class="widget-head">
        <h2>Funnel by stages</h2>
        <svg class="info" viewBox="64 64 896 896" aria-hidden="true"><path fill="currentColor" d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/><path fill="currentColor" d="M464 336a48 48 0 1096 0 48 48 0 10-96 0zm72 112h-48c-4.4 0-8 3.6-8 8v272c0 4.4 3.6 8 8 8h48c4.4 0 8-3.6 8-8V456c0-4.4-3.6-8-8-8z"/></svg>
        <label class="toggle header-toggle" title="When on, each stage count is this stage plus every stage after it.">
          <input id="addLater" type="checkbox" checked />
          Combine
        </label>
      </div>
      <div id="single" class="chart-frame">
        <div id="chart-main" class="chart"></div>
        <svg class="label-lines" aria-hidden="true"></svg>
        <ul id="labels-main" class="label-col hidden"></ul>
      </div>
    </section>

    <section class="panel" id="settings">
      <div class="panel-head">
        <h2>Settings</h2>
        <div class="preset-actions">
          <button type="button" class="btn" id="preset-default" title="Reset every setting to the production chart">Default</button>
          <button type="button" class="btn" id="preset-upgrade" title="Reset every setting to the proposed funnel">Upgrade</button>
        </div>
      </div>
      <div class="setting" id="chart-row">
        <span class="k">Chart</span>
        <div class="seg" id="chart-seg" role="tablist" aria-label="Chart variant">
          <button type="button" data-view="current" aria-pressed="true">Current (columnrange)</button>
          <button type="button" data-view="funnel" aria-pressed="false">Funnel</button>
          <button type="button" data-view="horizontal" aria-pressed="false">Horizontal funnel (custom)</button>
          <button type="button" data-view="streamgraph" aria-pressed="false">Streamgraph</button>
          <button type="button" data-view="orderbook" aria-pressed="false">Order book (bar)</button>
        </div>
      </div>
      <div class="setting" id="funnel3d-row">
        <span class="k">3D</span>
        <label class="toggle">
          <input id="funnel3d" type="checkbox" />
          Funnel 3D
        </label>
      </div>
      <div class="setting" id="labels-row">
        <span class="k">Labels</span>
        <div class="seg" id="labels-seg" role="tablist" aria-label="Label placement">
          <button type="button" data-labels="inside" aria-pressed="true">Inside</button>
          <button type="button" data-labels="side" aria-pressed="false">Side</button>
          <button type="button" data-labels="line" aria-pressed="false">Line</button>
          <button type="button" data-labels="table" aria-pressed="false">Table</button>
        </div>
      </div>
      <div class="setting" id="height-row">
        <span class="k">Height</span>
        <div class="seg" id="height-seg" role="tablist" aria-label="Slice height">
          <button type="button" data-height="share" aria-pressed="false">Proportional</button>
          <button type="button" data-height="progressive" aria-pressed="false">Progressive</button>
          <button type="button" data-height="floor" aria-pressed="false">Proportional min height</button>
          <button type="button" data-height="progfloor" aria-pressed="false">Progressive min height</button>
          <button type="button" data-height="equal" aria-pressed="true">Equal</button>
        </div>
        <label class="toggle field" id="minpx-toggle">
          <input id="minHeightPx" type="number" min="8" max="80" value="18" />
          px
        </label>
        <span class="hint" id="height-hint"></span>
      </div>
      <div class="setting" id="numbers-row">
        <span class="k">Numbers</span>
        <div class="seg" id="numbers-seg" role="tablist" aria-label="Numbers per stage">
          <button type="button" data-numbers="1" aria-pressed="true">1</button>
          <button type="button" data-numbers="2" aria-pressed="false">2</button>
          <button type="button" data-numbers="3" aria-pressed="false">3</button>
        </div>
        <span class="hint" id="numbers-hint">count</span>
        <label class="toggle" id="cols-toggle">
          <input id="splitNumbers" type="checkbox" checked />
          Number columns
        </label>
      </div>
      <div class="setting" id="style-row">
        <span class="k">Style</span>
        <label class="toggle" id="rich-toggle">
          <input id="richColor" type="checkbox" />
          Rich color
        </label>
      </div>
      <div class="setting stack" id="neck-row">
        <span class="k">Neck</span>
        <div class="sliders">
          <label class="slide">
            <span>Width</span>
            <input id="neckWidth" type="range" min="0" max="80" value="22" />
            <input id="neckWidthNum" type="number" min="0" max="80" value="22" />
            <span class="unit">%</span>
          </label>
          <label class="slide" id="neck-height-slide">
            <span>Height</span>
            <input id="neckHeight" type="range" min="0" max="80" value="22" />
            <input id="neckHeightNum" type="number" min="0" max="80" value="22" />
            <span class="unit">%</span>
          </label>
          <p class="hint" id="neck-hint">Height 0 is a truncated triangle. Raise it for a bottle.</p>
        </div>
      </div>
      <div class="setting stack" id="tilt-row">
        <span class="k">Tilt</span>
        <div class="sliders">
          <label class="slide">
            <span>Alpha</span>
            <input id="tiltAlpha" type="range" min="-20" max="45" value="10" />
            <input id="tiltAlphaNum" type="number" min="-20" max="45" value="10" />
            <span class="unit">°</span>
          </label>
          <label class="slide">
            <span>Beta</span>
            <input id="tiltBeta" type="range" min="-45" max="45" value="0" />
            <input id="tiltBetaNum" type="number" min="-45" max="45" value="0" />
            <span class="unit">°</span>
          </label>
          <p class="hint">Alpha tilts up and down. Beta turns left and right.</p>
        </div>
      </div>
      <div class="setting stack">
        <span class="k">Volume</span>
        <div class="volume-wrap">
          <div id="volume-grid" class="volume-grid"></div>
          <button type="button" class="text-btn" id="volume-reset">Reset to sample</button>
        </div>
      </div>
    </section>

    <section class="panel spec" id="spec">
      <h2>For developers</h2>
      <pre id="spec-body"></pre>
    </section>
  </div>

  <div id="mask" class="mask hidden"></div>
  <aside id="drawer" class="drawer hidden" role="dialog" aria-labelledby="drawer-title">
    <header>
      <div>
        <h2 id="drawer-title"></h2>
        <p class="sub" id="drawer-sub"></p>
      </div>
      <button type="button" class="close" id="drawer-close" aria-label="Close">×</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <script src="vendor/highcharts.js"></script>
  <script src="vendor/highcharts-more.js"></script>
  <script src="vendor/highcharts-3d.js"></script>
  <script src="vendor/modules/funnel.js"></script>
  <script src="vendor/modules/cylinder.js"></script>
  <script src="vendor/modules/funnel3d.js"></script>
  <script src="vendor/modules/streamgraph.js"></script>
  <div id="float-tip" class="float-tip hidden"></div>
  <script src="app.js?v=10"></script>
</body>
</html>
